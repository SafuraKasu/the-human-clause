81163bd7a"}], "audit_integrity": {"status": "ok", "entries": 77, "first_bad_seq": null, "message": "77 entries, chain intact (head 3e4ab2d3efd2...)"}, "reviews": [], "review_integrity": {"status": "none", "message": "no human review recorded", "entries": 0}, "review_status": {"E2:finding:DEMO-INT-002": null, "E3:finding:DEMO-INT-002": null, "E3:finding:DEMO-LAB-001:glucophage": null, "E3:finding:DEMO-LAB-002:aldactone": null, "E4:finding:DEMO-LAB-001:glucophage": null, "E5:escalation:ED_btg_B_meds": null, "E5:finding:DEMO-LAB-001:glucophage": null, "E6:finding:DEMO-LAB-001:glucophage": null}, "chunks": {"dha-consent-access-standard-2025#0018": {"document": "Standards for Health Information Consent and Access Control, Version 1 (2025)", "section": "p.22", "page": 22, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/012025/Standards%20for%20Consnet%20and%20Access%20Control2025129762.pdf", "text": "9.3. The Entity should explain to the Data Subject/Patient the potential consequences of not sharing information through HIS.  If, after a discussion, the Patient continues to object; Data Subject/Patient must be given the right to withdraw and opt-out. 9.4. The withdrawal of consent should not affect any sharing carried out under consent before its withdrawal.  Any Entity that has accessed or received health information via Standards for Health Information Consent and Access Control Code: DHA/HISHD/ST-09 Issue Nu: 1 Issue Date: 02/01/2025 Effective Date: 02/04/2025 Revision Date: 02/01/2030        Page 23 of 42 the HIS prior to such revocation and incorporated such PHI into its records may retain such information in its records. 9.5. In case the Data Subject/Patient has opted out of HIS  then: 9.6. Personal Health Information should continue to be received by HIS from the Entity; however, Data Subject/Patient identifiers mu st be anonymised as per The UAE Federal Law No. (45) of 2021 Regarding Data Protection  and Policy for Health Data Protection and Confidentiality. 9.7. Personal Health Information should not be retrieved using BTG access. 9.8. Entities must archive the opting out consents, and it shoul d be provided to HIS management on request. 9.9. Nabidh opt out is managed by DHA through below process: 9.9.1. Entity provides the Data Subject/Patient a copy of the Nabidh opting out consent  along with associated DHA email: Nabidh.optout@dha.gov.ae  ."}, "eu-ehds-2025-327#0107": {"document": "Regulation (EU) 2025/327 on the European Health Data Space", "section": "Article 20", "page": 41, "scope": "EU (comparator)", "url": "https://eur-lex.europa.eu/eli/reg/2025/327/oj", "text": "Reporting by digital health authorities Digital health authorities designated pursuant to Article 19 shall publish an activity report every two years, which shall contain a comprehensive overview of their activities. If a Member State designates more than one digital health authority, one of them shall be responsible for the drawing up of the report and, in doing so, it shall request the necessary information from the other digital health authorities. That activity report shall follow a structure agreed at Union level within the European Health Data Space Board (the ‘EHDS Board’) referred to in Article 92. That activity report shall contain at least information concerning: (a) the measures taken to implement this Regulation; (b) the percentage of natural persons having access to the various data categories of their electronic health records; (c) the handling of requests from natural persons regarding the exercise of their rights pursuant to this Regulation; (d) the number of healthcare providers of different types, including pharmacies, hospitals and other points of care, connected to MyHealth@EU calculated: (i) in absolute terms; (ii) as a share of all healthcare providers of the same type; and (iii) as a share of natural persons that are able to use the services; (e) the volumes of electronic health data of different categories shared across borders through MyHealth@EU; (f) the number of cases of non-compliance with mandatory requirements."}, "uae-health-ict-exec-reg-2020#0007": {"document": "Cabinet Resolution No. (32) of 2020, Executive Regulation of Federal Law No. (2) of 2019", "section": "Article 6 (part 1)", "page": 5, "scope": "UAE federal", "url": "https://uaelegislation.gov.ae/en/legislations/1444", "text": "Conditions and Controls for Using the Central System and Exchange of Health Data and Information Using the Central System and exchange of health data and information shall subject to the following conditions and controls: 1. Suppliers, entities and persons authorised to access any of the information and communication technology systems shall agree to a pledge not to disclose the health data and information that was accessed through the use of the Central System. 2. The disclosure of the patient's health information to any party without the consent of the patient or his representative shall be legally prohibited, unless disclo sure of this information is permitted in accordance with the legislation in force in the state. 3. In case of an emergency and if the patient's consent cannot be obtained, health care providers may examine the patient's file for health care purposes and s hall provide reasons for examination. 4. The patient's file should not be left open unattended, and computers or any other electronic means should be switched off when not in use. 5. Any suspicious activities that would affect the confidentiality of data and information shall be reported. 6. It is prohibited to send an email or use any other electronic means of communication that contains patient information unless it is encrypted. 7. In the event that information is entered incorrectly or if some information is not entered, the error should be modified or the requested information should be completed while maintaining the original entry for quality and auditing purposes. Cabinet Resolution of 2020 Concerning the Executive Regulations of Federal Law of 2019 Concerning the Use of the Information and Communication Technology in the Areas of Health 6 8. When modifying any data, the reason for the modification should be entered and the information that was modified and the date of the modification shall be stored, along with the electronic signature of the person who made the modification. 9. Tracking the changes t o information and data should be ensured once entered or ratified. 10."}, "dha-consent-access-standard-2025#0011": {"document": "Standards for Health Information Consent and Access Control, Version 1 (2025)", "section": "p.15", "page": 15, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/012025/Standards%20for%20Consnet%20and%20Access%20Control2025129762.pdf", "text": "The \"Standard for Health Information Consent and Access Control \" aims to fulfil the requirements for accessing PHI as per UAE laws and DHA regulations; in order to position Dubai as a global medical destination by introducing a value -based, comprehensive, integrated and high-quality service delivery system. 2. SCOPE 2.1. All PHI within the Emirate of Dubai accessed by Entities under jurisdiction of DHA. 2.2. All users accessing PHI in healthcare sector in the Emirate of Dubai; including all employees, trainees, students, contractors, consultants, suppliers, vendors, partners, customers and wider stakeholders where appropriate. Standards for Health Information Consent and Access Control Code: DHA/HISHD/ST-09 Issue Nu: 1 Issue Date: 02/01/2025 Effective Date: 02/04/2025 Revision Date: 02/01/2030        Page 16 of 42 3. PURPOSE 3.1. To set out Dubai Health Authority (DHA)`s requirements for access to PHI through Health Information Systems (HIS) in the Emirate of Dubai; in line with the United Arab Emirates (UAE) laws, Emirate of Dubai legislations, and DHA regulatory frameworks. 3.2. To ensure Entities under jurisdiction of DHA are providing a secure access to PHI. 3.3. To guarantee that Data Subject/Patient can permit or withhold the use and disclosure of PHI through HIS with full autonomy and as per UAE law. 4. APPLICABILITY 4.1. All PHI within the Emirate of Dubai accessed by Entities under jurisdiction of DHA."}, "uae-pdpl-2021#0005": {"document": "Federal Decree-Law No. (45) of 2021 Concerning the Protection of Personal Data", "section": "Article 2", "page": 6, "scope": "UAE federal", "url": "https://uaelegislation.gov.ae/en/legislations/1972", "text": "Scope of Application of the Decree by Law 1. Provisions of this Decree by Law shall apply to the processing of all or part of the Personal Data by means of electronic systems which operate automatically, or by other means, by the following: a. Each Data Subject residing in the State or having a place of business in it. b. Each Controller or Processor residing in the State and carrying out the activities of processing Personal Data of Data Subjects inside and outside the State. c. Each Controller or Processor residing outside the State and carrying out the activities of processing Personal Data of Data Subjects inside the State. 2. Provisions of this Decree by Law shall not apply to the following: a. Government Data b. Governmental entities which control or process Personal Data. c. Personal Data held by the security and judicial authorities d. A Data Subject who processes his/her data for personal purposes. e. Personal Health Data that has legislation regulating its protection and processing. f. Personal banking and credit data and information that have legislation regulating their protection and processing. g. Companies and establishments located in free zones in the Country and have special Federal Decree by Law Concerning the Protection of Personal Data 7 legislations regarding Personal Data protection."}, "dha-health-info-sharing-2024#0004": {"document": "Policy for Health Information Sharing (2024)", "section": "p.3", "page": 3, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/082024/Policy%20for%20Health%20Information%20Sharing_EN202480306.pdf", "text": "Entity: Any Entity or institution within the Emirate of Dubai that provides health services to people, including: the areas of prevention, treatment, and recovery, whether owned or managed by a natural or legal person.  It may also include providers of health insurance or health insurance services, third party claims administrators, or those managing insurance requirements/services; or Electronic services in the health field, or any services directly or indirectly related to the application of the provisions of this policy. Health Information: Health data that has been processed and made apparent and evident ID Issue# Issue Date  Effective Date  Revision Date  Page# HISHD/PP-13 01 August 10, 2024 Nov 10, 2024 August 10, 2029 4/39 whether visible, audi ble or readable, and which are characterized by a health nature whether related to health facilities, health insurance agencies, or beneficiaries of health services. Health Information Sharing : Access, exchange, copying, photocopying, transfer, storage, publication, disclosure or transmission of health data and information. Health Registry: is a regular collection of data and information from the patient’s file on certain diseases and health conditions. Good Clinical Practice: Good clinical practice is an international quality standard for conducting clinical trials that in some countries is provided by International Conference on Harmonisation (ICH), an international body that defines a set of standards, which governments can then transpose into regulations for clinical trials involving human subjects."}, "eu-ehds-2025-327#0128": {"document": "Regulation (EU) 2025/327 on the European Health Data Space", "section": "Article 32 (part 3)", "page": 47, "scope": "EU (comparator)", "url": "https://eur-lex.europa.eu/eli/reg/2025/327/oj", "text": "Importers shall cooperate with those authorities, at their request, on any action taken to bring their EHR systems into conformity with the essential requirements in relation to the harmonised software components as laid down in Annex II or to ensure that the EHR systems which are not in conformity with those essential requirements are recalled or withdrawn. 8. Importers shall establish reporting channels and ensure that they are accessible to allow users to submit complaints, and shall keep a register of complaints, of non-conforming EHR systems and EHR system recalls and withdrawals. Importers shall verify whether the channels of complaint established pursuant to Article 30(1), point (n), are publicly available, allowing users to submit complaints and to receive any communication concerning any risk related to their health and safety or to other aspects of public interest protection and allowing users to be informed of any serious incident involving an EHR system. Where such channels of complaint were not established, the importers shall establish them and take into account the accessibility needs of vulnerable groups and persons with disabilities. 9. Importers shall investigate complaints and follow up on information received on incidents involving an EHR system they made available on the market. Importers shall register those complaints, any recalls or withdrawals of EHR systems and any corrective measure taken to bring the EHR system into conformity, in the register referred to in Article 30(1), point (o), or in their own internal register. Importers shall keep the manufacturer, distributors and, where relevant, authorised representatives informed in a timely manner of the investigation and follow-up carried out and of the results of the investigation and follow-up. EN OJ L, 5.3.2025 48/96 ELI: http://data.europa.eu/eli/reg/2025/327/oj"}, "doh-hie-policy-2020#0053": {"document": "DoH Policy on the Abu Dhabi Health Information Exchange (April 2020)", "section": "p.43", "page": 43, "scope": "Abu Dhabi", "url": "https://doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx", "text": "6.1.3.17.1 Review of network intrusion detection system activity logs.  [P3] 6.1.3.17.2 Review of system administrator authorizations and activity.  [P3] 6.1.3.17.3 Review of physical access to data centers.  [P3] 6.1.3.17.4 Other reviews of technical, physical, and  administrative safeguards as established by the Policies of the organization and industry standards. [P3] 6.1.3.18 Establish system interoperability standards that may include the following: 6.1.3.18.1 Domain Data Content and Structure Standards: includes information models,  data naming standards, and controlled vocabularies. These represent semantic specifications that support business process level Interoperability. Examples include: 6.1.3.18.1.1 HL7 (version 2.x or 3.0) and NCPDP SCRIPT, the de facto industry messaging standards for g eneral healthcare and prescription data respectively, should be used where  applicable. The HL7 Reference Information Model offers a ready set of data standards that provide the semantic interoperability underpinning for HL7 messaging standards. [P3] 6.1.3.18.1.2 Clinical Terminology (SNOMED) for support a common computerized language for use across all provider organizations. [P3] 6.1.3.18.1.3 XML 1.0 is the data message notation standard for inter-application data communication and shall be the default message serialization f ormat. [P3] 6.1.4 Emergency access to Patient Data on the ADHIE Platform is permitted when treating a patient with a qualified condition by (i) a Healthcare Professional; (ii) an Authorized User acting under the direction of a Healthcare Professional; or (iii) an Advan ced Emergency Medical Technician ."}, "doh-hie-policy-2020#0007": {"document": "DoH Policy on the Abu Dhabi Health Information Exchange (April 2020)", "section": "p.8", "page": 8, "scope": "Abu Dhabi", "url": "https://doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx", "text": "Page 8 of 44 Government Oversight and Policy Task Force Responsible for the implementation and enforcement of Policies and standards regarding the ADHIE’s operations, infrastructure, and data management to ensure accountability and a protection of Abu Dhabi’s public interest. Health System Stakeholders This includes Patients, Healthcare Facilities, Insurers, national and local health regulators, and other relevant entities. Healthcare Facility A DOH licensed establishment (including any hospital, clinic, surgery, pharmacy, diagnostic center, and other facility) where healthcare services are provided by Healthcare Professionals in the Emirate of Abu Dhabi. Healthcare Operations This includes, without limitation, administrative activities that support Health System Stakeholders, including conducting quality and improvement assessments; training employees; conducting medical, legal, and compliance reviews; performing audits; business planning and development; and other general management activities (e.g. customer service, resolving internal grievances, etc.). Healthcare Professional A healthcare professional who treats or deals with Patients in the Emirate of Abu Dhabi who is licensed & regulated by DOH Information System An interconnected set of information resources under the same direct management control that shares common functionality. A system normally includes hardware, software, information, data, applications, communications, and people."}, "uae-health-ict-law-2019#0016": {"document": "Federal Law No. (2) of 2019 Concerning the Use of ICT in Health Fields", "section": "Article 13", "page": 8, "scope": "UAE federal", "url": "https://uaelegislation.gov.ae/en/legislations/1209", "text": "Storing and transforming the health data and information outside State It is not permissible to store, process, generate or transform the health data and information outside State -which are related to the health services provided inside State - except in the case where a resolution is issued from the Health Authority in coord ination with the Ministry."}, "doh-circular-2026-144-malaffi-referrals#0001": {"document": "DoH Circular 2026/144: Mandatory Submission of Referral Data to Malaffi", "section": "p.1", "page": 1, "scope": "Abu Dhabi", "url": "https://www.doh.gov.ae/-/media/C01533BB56EE4A7D9B75107C89656941.ashx", "text": "Subject: Mandatory Submission of Referral Data to Malaffi in Support of Abu Dhabi Primary Care Model We extend our greetings and best wishes for your continued success. The exchange of referral data through Malaffi is a critical enabler of the Abu Dhabi Primary Care Model, supporting care coordination, continuity of care, referral tracking, and enhancing patient journeys across the healthcare system. The Malaffi e- Referral capability is intended to facilitate referral management, status monitoring, and communication between referring and receiving providers. Hence, the Department of Health (DoH) reiterates that all healthcare facilities are required to ensure the complete, accurate, and timely submission of referral data to the Malaffi Health Information Exchange Platform. All healthcare facilities must submit all referral transactions to Malaffi using the specifications of the REF HL7 messages type to send the main attributes of referrals such as priority and SNOMED coded specialty, both of which are clarified under “Referral priority and SNOMED Referral services code sets\" Compliance Deadline All Healthcare facilities must achieve full compliance with this circular by no later than August 31, 2026. Regulatory Enforcement DoH will monitor compliance through Malaffi data and utilization reports. Failure to comply with this circular may result in regulatory actions in accordance with applicable DoH regulations, standards, and licensing requirements."}, "doh-hie-policy-2020#0037": {"document": "DoH Policy on the Abu Dhabi Health Information Exchange (April 2020)", "section": "p.31", "page": 31, "scope": "Abu Dhabi", "url": "https://doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx", "text": "4.4 Policy Priority 4: Data Quality Objective 7: Achieve Interoperability of Data provided by Healthcare Facilities, such that the Data provided by one Healthcare Facility can meaningfully be used by another Healthcare Facility to improve the quality and coordination of  care. Strategy 7: Set out the requirements and standards for all solutions and components that support ADHIE Platform interoperability. 4.4.1 All Healthcare Facilities Shall: 4.4.1.1 Develop, implement and maintain an electronic interface between its Electronic System and the ADHIE Platform in accordance with the ADHIE Platform Interface Standards and the policies to enable the Transaction of Patient Data between that Participant and the other Participants. 4.4.1.2 Develop and implement an Interoperability Policy that is line w ith the Participation Criteria and this Policy. Page 32 of 44 4.4.1.3 Ensure that network connectivity from its own premises is in place to the ADHIE Platform data centres. 4.4.1.4 Ensure that its connection to and use of the ADHIE Platform does not include, and that any method of transmitting of Data (including any Patient Data) will not introduce, any program, routine, subroutine, or data (including Malicious Software or “malware,” viruses, worms, and Trojan Horses) which will disrupt the proper operation of the ADHIE P latform or any part thereof or any hardware or software used by the ADHIE Operator in connection therewith, or which, upon the occurrence of a certain event, the passage of time, or the taking of or failure to take any action will cause the ADHIE Platform or any part thereof or any hardware, software or Data (including any Patient Data) used by the ADHIE Operator or any other Participant in connection  therewith, to be destroyed, damaged, or rendered  inoperable."}, "dha-health-info-sharing-2024#0015": {"document": "Policy for Health Information Sharing (2024)", "section": "p.15", "page": 15, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/082024/Policy%20for%20Health%20Information%20Sharing_EN202480306.pdf", "text": "4.6.5. Below table demonstrates different settings that PHI can be shared  for Data Subject/Patient care purposes: Care Purpose/Primary Use of Health Information Between Entities in Dubai Medical record transfer with Patient consent Nabidh access with Patient consent Between Entities of the same organization in the UAE Patient consent needed Between Entities (not within the same organization) in the UAE Patient transferring his/her own Health Information  Referral process with clear signed consent  HIE Exchange )Nabidh, Malaffi, Riayati)  with Patient consent Patients who are being treated outside the UAE, within the limits of the necessary treatment procedures. Patient consent needed Health Data related to samples that are sent to laboratories outside the UAE. Patient consent needed 4.7. Protected Health Information Sharing for non -Care Purposes (Secondary use of Health Information) 4.7.1. All Entities that share PHI are required under UAE laws and DHA \"Health Data & ID Issue# Issue Date  Effective Date  Revision Date  Page# HISHD/PP-13 01 August 10, 2024 Nov 10, 2024 August 10, 2029 16/39 Information Protection and Confidentiality Policy\" ( Health Data & Information Protection & Confidentiality Policy) to protect it from inappropriate disclosure. 4.7.2. For data associated with \"UAE National Genome Project\", it should be as per UAE National Genome Repository Data Access Framework and related policies."}, "eu-ehds-2025-327#0094": {"document": "Regulation (EU) 2025/327 on the European Health Data Space", "section": "Article 10", "page": 36, "scope": "EU (comparator)", "url": "https://eur-lex.europa.eu/eli/reg/2025/327/oj", "text": "Right of natural persons to opt out in primary use 1. Member States’ laws may provide that natural persons have the right to opt out from the access to their personal electronic health data registered in an EHR system through the electronic health data access services referred to in Articles 4 and 12. In such cases, Member States shall ensure that the exercise of that right is reversible. 2. If a Member State provides for a right referred to in paragraph 1 of this Article, it shall establish the rules and specific safeguards regarding the opt-out mechanism. In particular, Member States may provide for a healthcare provider or health professional to be able to get access to the personal electronic health data in cases where processing is necessary in order to protect the vital interests of the data subject or of another natural person as referred to in Article 9(2), point (c), of Regulation (EU) 2016/679, even if the patient has exercised the right to opt out in primary use."}, "doh-hie-policy-2020#0054": {"document": "DoH Policy on the Abu Dhabi Health Information Exchange (April 2020)", "section": "p.44", "page": 44, "scope": "Abu Dhabi", "url": "https://doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx", "text": "Page 44 of 44 These individuals may “break the  seal” if the conditions are met: 6.1.4.1 Treatment may be provided to the Patient, in the Healthcare Professional’s or Advanced Emergency Medical Technician’s judgment if a qualified condition exists and the patient is in immediate need of medical attention. [P3] 6.1.4.2  The Healthcare Professional or Advanced Emergency Medical Technician determines, in his or her reasonable judgment, that information that may be held by or accessible via the ADHIE Platform may be material to emergency treatment. [P3] 6.1.4.3 If an Authorized User acting under the direction of a Healthcare Professional “breaks the seal”, such Authorized User must record the name of the Healthcare Professional providing such direction.  [P3] 6.1.4.4 The Healthcare Professional, Advanced Emergency Medical Technician or Authorized User acting under the direction of a Healthcare Professional attests that all the foregoing conditions have bee n satisfied, and the ADHIE Platform software maintains a record of this access.  [P3] 6.1.4.5 All Healthcare Facilities are required to track and document all “break the seal” occurrences and to assure conditions as described in the policy have been met. 6.1.4.6 The ADHIE Operator and/or DOH reserves the right to perform ongoing audits of all “break the seal” occurrences.  [P3] 6.1.4.7 All Healthcare Facilities ensure that access to Patient Health Information via the ADHIE Platform utilizing “Break the Seal” when treating a patient terminates upon the completion of the emergency treatment.  [P3]"}, "doh-hie-policy-2020#0022": {"document": "DoH Policy on the Abu Dhabi Health Information Exchange (April 2020)", "section": "p.20", "page": 20, "scope": "Abu Dhabi", "url": "https://doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx", "text": "4.2.1.3 Ensure compliance with relevant Applicable Law, in particular this policy and Article 23 of the Implementing Regulation of  the Abu Dhabi Law No. (23) of 2005 Concerning Health Insurance in the Emirate of Abu Dhabi, both of whom mandate the sharing of Patient Data by Healthcare Facilities in the Emirate of Abu Dhabi. 4.2.2 All Healthcare Facilities shall: Page 21 of 44 4.2.2.1 Comply with  relevant DOH regulatory requirements regarding patient rights and responsibilities 4.2.2.2 Seek patient consent for the sharing of Patient Data via the ADHIE in accordance with all DOH’s Policies, including by incorporating the following into their standard patie nt consent forms from the effective  date of this policy: 4.2.2.2.1 Patients consent to the sharing of their Patient Data via the ADHIE whether it is newly-generated or past Patient Data. 4.2.2.2.2 Patients provide their consent to the sharing of their newly - generated or past  Patient Data via the ADHIE to the Healthcare Facility (and its relevant treating Healthcare Professionals and its other Authorized Users) requesting the consent, plus every other Healthcare Facility (and their respective treating Healthcare Professionals and other authorized users) who will send or receive or who may have sent or received that patient’s Patient Data via the ADHIE at any time. 4.2.2.3 Comply with DOH’s mandate to share Patient Data to the extent patient consent is unavailable."}, "doh-hie-policy-2020#0021": {"document": "DoH Policy on the Abu Dhabi Health Information Exchange (April 2020)", "section": "p.19", "page": 19, "scope": "Abu Dhabi", "url": "https://doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx", "text": "4.1.3.4 Ensure compliance of all ADHIE systems and processes with the Abu Dhabi Health Information and Cyber Security  Standard (ADHICS) and other relevant information security regulations. Page 20 of 44 4.2 Policy Priority 2: Universal Patient  Participation The DOH seeks to ensure that all licensed Healthcare Facilities in the Emirate of Abu Dhabi maximize the number of patients whose data is available through the ADHIE Platform. Policy objectives 2. Universal participation by all patients to the ADHIE Platform Objective 2: Maximize the number of patients whose data is available through the ADHIE Platform through making universal patient participation in and sharing of data with the ADHIE Platform mandatory. Strategy 2: Set out the requirements for Healthcare Facilities and DOH to establish universal participation of patients in the ADHIE and to inform patients of their role in the ADHIE. 4.2.1 DOH shall: 4.2.1.1 Develop and oversee the implementation of further policies, standards, and guidelines related to ADHIE participation as necessary in accordance with Federal and Abu Dhabi Laws and other regulatory  instruments. 4.2.1.2 Require Healthcare Facilities to obtain patient consent for the sharing of Patient Data via the ADHIE in accordance with all DOH’s Policies. To the extent patient consent for the sharing of Patient Data via the ADHIE is unavailable for any reason (e.g. for legacy data), DOH in accordance with all Federal and Emirate laws and pursuant to its authority as the regulator of the Healthcare sector in the Emirate of Abu Dhabi, requires and authorizes Healthcare Facilities to share and receive such Patient Data (notwithstanding the unavailability of patient consent) through the ADHIE as set out in any instructions from DOH and as set out in this policy."}, "dha-consent-access-standard-2025#0015": {"document": "Standards for Health Information Consent and Access Control, Version 1 (2025)", "section": "p.19", "page": 19, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/012025/Standards%20for%20Consnet%20and%20Access%20Control2025129762.pdf", "text": "8.1.2. Data or health information required by the health insurance companies or any provider of health services in respect of the health services received by the Standards for Health Information Consent and Access Control Code: DHA/HISHD/ST-09 Issue Nu: 1 Issue Date: 02/01/2025 Effective Date: 02/04/2025 Revision Date: 02/01/2030        Page 20 of 42 Patient for purposes of auditing, approving or verifying the financial benefits related to those services. 8.1.3. For preventive and curative measures related to public health, or to m aintain the health and safety of the Patients, or any other persons in contact with them. 8.2. Consent is required for accessing PHI through other HIS. 8.3. Entities must initiate registration process of the Data Subject/Patient on current and any future platforms; and record the consent (refusal/withdrawal/re -opt in) with dates. 8.4. Entities must obtain consent from Data Subject/Patient in paper or electronic format. 8.5. If the Entity chooses to use electronic signatures for healthcare transactions, then it must comply with  the Dubai electronic signature standard.  The UAE electronic signatures is governed by the Federal Decree-Law No. 46 of year 2021 on Electronic Transactions and Trust Services UAE Electronic-Transactions-and-trust-services- law. 8.6. Consent should be specific, freely given, informed and unambiguous; using clear and plain language that is understood by the Data Subject/Patient."}, "doh-hie-policy-2020#0018": {"document": "DoH Policy on the Abu Dhabi Health Information Exchange (April 2020)", "section": "p.17", "page": 17, "scope": "Abu Dhabi", "url": "https://doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx", "text": "3.3.9 Partnership: insurers and providers (public and the private sector) shall be seen as strategic partners driving the development of this policy and its implementation. 3.3.10 Coordination, collaboration and communication: are critical components of effective health information exchange at all levels amongst  stakeholders. Page 18 of 44 4. Policy Priority, Objectives and Strategies 4.1 Policy Priority 1: Universal Stakeholder  Participation DOH seeks to ensure that all licensed Healthcare Fac ilities in the Emirate of Abu Dhabi participate in the Abu Dhabi Health Information Exchange (ADHIE) in compliance with the Abu Dhabi Health Information and Cyber Security Standard (ADHICS). Policy objectives 1. Universal Participation by all Healthcare Facilities as Data Suppliers to the ADHIE Platform. Objective 1: DOH seeks to ensure all Healthcare Facilities connect and exchange data with the ADHIE as required by the ADHIE for the effective operation of the ADHIE Platform. Strategy 1: Set out the requirements for Healthcare Facilities, DOH, and ADHIE to ensure that Patient Health Information is capable of being exchanged through the ADHIE Platform in such a way that it can be used meaningfully to aid the goal of improved care coordination and quality. 4.1.1 DOH shall: 4.1.1.1 Develop and oversee the implementation of further policies, standards, and guidelines related to ADHIE participation as necessary in accordance with Federal and Abu Dhabi Laws and other regulatory  instruments."}, "doh-circular-2026-10-malaffi-onboarding#0001": {"document": "DoH Circular 2026/10: Mandatory On-boarding of Minimum Required Dataset with Malaffi", "section": "p.1", "page": 1, "scope": "Abu Dhabi", "url": "https://www.doh.gov.ae/-/media/84A213F71AA545D69E01A23A0A99C598.ashx", "text": "Subject:  Mandatory On-boarding - Minimum Required Dataset with Malaffi Platform for All Healthcare Facilities in Abu Dhabi We extend our greetings and best wishes for your continued success. In alignment with DoH’s Policy on the Abu Dhabi Health Information Exchange, all are required to comply with the data reporting requirements to Malaffi platform. In addition, all are required to ensure that the minimum datasets (attached) are connected and successfully transmitting data to the Malaffi platform within six (6) months from the date of this circular. Please reach out to Abu Dhabi Health Data Services team to confirm which data sets are applicable for your facility type. Each facility must submit an implementation plan to Malaffi Onboarding team within 1 month of this circular date, via email: (onboarding@malaffi.ae) Failure to comply with the above (submission of plan within one month and on-boarding within six months) will render the facility non-compliant with DoH policy and may result in denial/restriction of license renewal. Furthermore, DoH will monitor data submission compliance for all required datasets and necessary action will be taken in case of non-compliance. Should you require any clarification or assistance with your implementation plan or on-boarding process, please contact the ADHDS/Malaffi Team via email: (onboarding@malaffi.ae) or contact the DoH HIE Office via email:"}, "dha-consent-access-standard-2025#0012": {"document": "Standards for Health Information Consent and Access Control, Version 1 (2025)", "section": "p.16", "page": 16, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/012025/Standards%20for%20Consnet%20and%20Access%20Control2025129762.pdf", "text": "4.2. All users accessing PHI in healthcare sector in the Emirate of Dubai; including all employees, trainees, students, contractors, consultants, suppliers, vendors, partners, customers and wider stakeholders where appropriate. 5. STANDARD ONE: CONSENT AND ACCESS CONTROL 5.1. The “Health Information Consent and Access Control Policy” is an integral part of the DHA’s approach to Health Information Governance (IG) in the Emirate of Dubai. This policy must be read in conjunction with other related DHA IG Policies. 5.2. All related UAE laws, Emirate of Dubai legislations, and DHA regulations on health IG are considered in this policy. Standards for Health Information Consent and Access Control Code: DHA/HISHD/ST-09 Issue Nu: 1 Issue Date: 02/01/2025 Effective Date: 02/04/2025 Revision Date: 02/01/2030        Page 17 of 42 5.3. All Entities must be able to demonstrate the lawful basis upon which they  are accessing PHI via HIS through obtaining consent of the Data Subject/Patient when mandated by UAE law or DHA regulations. 5.4. Access Control is required in order to comply with the UAE laws and DHA regulations and to safeguard the confidentiality, integri ty and availability of sensitive and confidential health information. 5.5. All Entities should implement a zero -trust mechanism to ensure that access is not inherently trusted for any user or device. This involves continuously verifying access based on multiple factors, including device health, user context, and the sensitivity of the requested resources, while also enforcing the principle of least privilege."}, "eu-ehds-2025-327#0010": {"document": "Regulation (EU) 2025/327 on the European Health Data Space", "section": "Preamble (part 10)", "page": 1, "scope": "EU (comparator)", "url": "https://eur-lex.europa.eu/eli/reg/2025/327/oj", "text": "Electronic health data access services should provide detailed information on access to data, such as when and which entity or natural person accessed data and which data were accessed. Natural persons should also be able to enable or disable automatic notifications regarding access to personal electronic health data relating to them through the health professional access services. (17) Natural persons might not want to allow access to some parts of their personal electronic health data while enabling access to other parts. This could especially be relevant in cases of sensitive health issues such as those related to mental or sexual health, sensitive procedures such as abortions, or data on specific medication which could reveal other sensitive issues. Such selective sharing of personal electronic health data should therefore be supported and implemented through restrictions set by the natural person concerned in the same way within the territory of a given Member State and for cross-border data sharing. Those restrictions should allow for sufficient granularity to restrict parts of datasets, such as elements of the patient summaries. Before setting the restrictions, natural persons should be informed of the risks for patient safety associated with limiting access to health data. Given that the unavailability of the restricted personal electronic health data may impact the provision or quality of health services provided to the natural person, natural persons making use of such access restrictions should assume responsibility for the fact EN OJ L, 5.3.2025 4/96 ELI: http://data.europa.eu/eli/reg/2025/327/oj that the healthcare provider cannot take the data into account when providing health services. The restrictions on access to personal electronic health data could have life-threatening consequences and, therefore, access to those data should nevertheless be possible where necessary to protect vital interests in emergency situations."}, "dha-consent-access-standard-2025#0017": {"document": "Standards for Health Information Consent and Access Control, Version 1 (2025)", "section": "p.21", "page": 21, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/012025/Standards%20for%20Consnet%20and%20Access%20Control2025129762.pdf", "text": "8.15. Where the information relates to an incompetent Data Subject/Patient or the Patient is unable to give the consent (e.g. unconscious), and consent is required for lawful accessing/sharing, this must be obtained from the next of kin (e.g. relatives up to the Standards for Health Information Consent and Access Control Code: DHA/HISHD/ST-09 Issue Nu: 1 Issue Date: 02/01/2025 Effective Date: 02/04/2025 Revision Date: 02/01/2030        Page 22 of 42 forth degree) or a person with legal guardianship. This authority must be verified and documented with the consent. 8.16. Consent for accessing HIS remains valid for one year after last health Encounter with the Data Subject/Patient, unless the Patient revokes their consent. 8.17. Consent is not req uired for uploading health information to the NABIDH by Healthcare Facilities. 8.18. Entities must include a clause within their general consent on sharing PHI with Nabidh (Nabidh HIE Access Consent ) as per DHA mandates. 9. STANDARD FIVE: OPTING OUT OF HEALTH INFORMATION SYSTEMS 9.1. All Data Subject/Patient should be given the opportunity to object the sharing of the PHI through HIS if the UAE law and DHA regulations allow. 9.2. This right is not valid for sharing PHI in EMR, public health portals, and insurance systems as per UAE Federal Law No. (2) For the year 2019 On the Use of Information and Communications Technology (ICT) in Healthcare   and DHA Health Data Protection and Confidentiality Policy."}, "eu-ehds-2025-327#0039": {"document": "Regulation (EU) 2025/327 on the European Health Data Space", "section": "Preamble (part 39)", "page": 1, "scope": "EU (comparator)", "url": "https://eur-lex.europa.eu/eli/reg/2025/327/oj", "text": "Data on clinical trials and clinical investigations should also be included in the categories of electronic health data for secondary use when the clinical trial or clinical investigation has ended, without affecting any voluntary data sharing by the sponsors of ongoing trials and investigations. Electronic health data for secondary use should be made available preferably in a structured electronic format that facilitates their processing by computer systems. Examples of structured electronic formats include records in a relational database, XML documents or CSV files and free text, audios, videos and images provided as computer-readable files. (57) Health data users who benefit from access to datasets provided for under this Regulation could enrich the data in those datasets with various corrections, annotations and other improvements, for instance by supplementing missing or incomplete data, thus improving the accuracy, completeness or quality of the data in the datasets. Health data users should be encouraged to report critical errors in datasets to health data access bodies. To support the improvement of the initial database and further use of the enriched dataset, Member States should be able to establish rules for the processing and the use of electronic health data containing improvements related to the processing of those data. The improved dataset should be made available free of charge to the original health data holder together with a description of the improvements. The health data holder should make the new dataset available, unless it provides a justified notification to the health data access body for not doing so, for instance in cases in which the enrichment by the health data user is of low quality. It should be ensured that non-personal electronic health data are available for secondary use. In particular, pathogen genomic data hold significant value for human health, as shown during the COVID-19 pandemic during which timely access to and sharing of such data proved to be essential for the rapid development of detection tools, medical countermeasures and responses to public health threats."}, "dha-health-info-sharing-2024#0016": {"document": "Policy for Health Information Sharing (2024)", "section": "p.16", "page": 16, "scope": "Dubai", "url": "https://dha.gov.ae/uploads/082024/Policy%20for%20Health%20Information%20Sharing_EN202480306.pdf", "text": "4.7.3. Effective pseudonymisation and anonymisation  techniques enable the Entity to undertake secondary use of PHI in a safe, secure and legal way. Through de - identification, users may make use of individual data for a range of secondary purposes without having to access the identifiable PHI. 4.7.4. The Entity is legitimate to process the PHI without Data Subject/Patient consent in certain circumstances, as per article (16) of UAE ICT Health law and article (4) of UAE Data Protection Law. In accordance with Article (16)  of Federal Law No. (2) of 2019 regarding the use of information and communications technology in health fields  and Article (4) of  Federal Law No. (45) of 2021 regarding the protection of personal data , everyone who handles patient data and information must maintain It confidential and not use  it for purposes other than health purposes without the written consent of the Data Subject/Patient, except in certain cases and in accordance with applicable legislation. 4.7.5. Below table elaborates more in details the secondary use of PHI: ID Issue# Issue Date  Effective Date  Revision Date  Page# HISHD/PP-13 01 August 10, 2024 Nov 10, 2024 August 10, 2029 17/39 Sharing PHI for Non-Care Purpose/Secondary Use of Health Information  without Data Subject/Patient Consent Justification Type of Information At the request of the competent judicial authorities. Identifiable Health Information For the investigation, establishment, exercise or defence of legal claims or potential legal claims including comp laints to the Regulator against the Entity or its employees; or whenever courts are acting in their judicial capacity."}, "uae-health-ict-law-2019#0019": {"document": "Federal Law No. (2) of 2019 Concerning the Use of ICT in Health Fields", "section": "Article 16", "page": 9, "scope": "UAE federal", "url": "https://uaelegislation.gov.ae/en/legislations/1209", "text": "Confidentiality of the patient information and exception therefrom Without violation to any applicable legislations, whoever circulates information related to the patients must keep its confidentiality and not to use them except  in the health purposes without written approval from the patient, except in any of the following cases: 1. The health data or information requested by the health insurance companies or any authority funding the health services regarding the health services received by the patient, for the review, approval or verification of the financial entitlements related to such services. 2. Purposes of the scientific and clinical research, provided that not to disclose the identity of the patients and to observe the morals and rules of the scientific researches. 3. To take the preventive and curative procedures related to the public health or to keep Federal Law No. (2) of 2019 Concerning the Use of the Information and Communications Technology in Health Fields 10 the health and safety of the patient or any other person contacting him. 4. Upon a request by the competent judicial authorities. 5. Upon a request by the Health Authority for purposes of monitoring and inspection and keeping the public health."}, "eu-gdpr-2016-679#0200": {"document": "Regulation (EU) 2016/679 (GDPR)", "section": "Article 75", "page": 79, "scope": "EU (comparator)", "url": "https://eur-lex.europa.eu/eli/reg/2016/679/oj", "text": "Secretariat 1. The Board shall have a secretariat, which shall be provided by the European Data Protection Supervisor. 2. The secretariat shall perform its tasks exclusively under the instructions of the Chair of the Board. 3. The staff of the European Data Protection Supervisor involved in carrying out the tasks conferred on the Board by this Regulation shall be subject to separate reporting lines from the staff involved in carrying out tasks conferred on the European Data Protection Supervisor. 4. Where appropriate, the Board and the European Data Protection Supervisor shall establish and publish a Memorandum of Understanding implementing this Article, determining the terms of their cooperation, and applicable to the staff of the European Data Protection Supervisor involved in carrying out the tasks conferred on the Board by this Regulation. 5. The secretariat shall provide analytical, administrative and logistical support to the Board. 6. The secretariat shall be responsible in particular for: (a)  the day-to-day business of the Board; (b)  communication between the members of the Board, its Chair and the Commission; (c)  communication with other institutions and the public; (d)  the use of electronic means for the internal and external communication; (e)  the translation of relevant information; (f)  the preparation and follow-up of the meetings of the Board; (g)  the preparation, drafting and publication of opinions, decisions on the settlement of disputes between supervisory authorities and other texts adopted by the Board."}, "dha-ai-policy-2021#0009": {"document": "DHA Policy: Artificial Intelligence in the Healthcare (DHA/HISHD/PP-09, effective 1 July 2021)", "section": "p.9", "page": 9, "scope": "Dubai", "url": "https://www.dha.gov.ae/uploads/082022/Artificial%20Intelligence%20Policy20228457.pdf", "text": "4.6.2. Comply with all Articles detailed within  UAE Federal Law No. (2) of 2019 concerning the Use of the Information and Communication Technology in the Area of Health (“ICT Health Law”). 4.6.3. Comply with Cabinet resolution No. (40) Of 2019 and Federal Decree-Law No. (4) of 2016,  Concerning the Executive Regulation of on Medical Liability and Addendum Regulations and Conditions for Providing Telehealth Services. 4.6.4. Comply with UAE federal, and Emirate of Dubai  electronic security authority standards and guidelines for cyber security. 4.6.5. Comply with the requirements of the Ministry of Health and Prevention for the use of pharmaceuticals, medical devices and medical advertisement. 4.6.6. Comply with all UAE federal and Emirate of Dubai human research l aws and ID Issue# Issue Date  Effective Date  Revision Date Page# HISHD/PP-09 01 01/07/2021 01/10/2021 01/07/2026 10/17 regulations. 4.6.7. Comply with \"Dubai Electronic Security Centre\" requirements. 4.6.8.  Comply with \"Smart Dubai Government\" regulations and requirements. 4.6.9. Comply with DHA-Dubai health insurance corporation requirements  for e-claims, reimbursement and documentations. 4.6.10. Comply with all required certification of the AI software and its major upgraded versions from recognized international/local agencies. 4.6.11. AI tool must prevent (inadv ertent) misuse of AI -enabled solutions; the performance must be monitored in clinical practice, and actual outcomes must be compared to those obtained in training and validation. Any significant discrepancies must call for further inspection."}, "uae-pdpl-2021#0010": {"document": "Federal Decree-Law No. (45) of 2021 Concerning the Protection of Personal Data", "section": "Article 6", "page": 9, "scope": "UAE federal", "url": "https://uaelegislation.gov.ae/en/legislations/1972", "text": "Terms of Consent to Data Processing 1. To be considered, the consent of the Data Subject to the processing of date shall require the following: a. The Controller shall be able to prove the consent of the Data Subject in the event that the processing of Personal Data is based on the consent of the Data Subject. b. The Consent shall be prepared in a clear, simple, unambiguous and easily accessible Federal Decree by Law Concerning the Protection of Personal Data 10 manner, whether in writing or electronically. c. The Consent shall include the Data Subject's right to withdraw it easily. 2. The Data Subject may, at any time, withdraw their consent to the processing of Personal Data. Such withdrawal of consent shall not affect the legality of the processing based on the given consent before withdrawing it."}}, "gaps": [{"id": "G1", "title": "Patients in different emirates get different consent and opt-out rights", "statement": "Dubai's 2025 standard gives patients a right to withdraw and opt out of the health information exchange. Abu Dhabi's 2020 exchange policy makes participation mandatory, authorizes sharing where consent is unavailable, and contains no opt-out provision (full-text scan: zero hits). The federal data-protection law's general right to withdraw consent cannot be assumed to fill the gap, because it excludes personal health data that has its own regulating legislation.", "relevance": "A patient treated in both emirates, as in our scenario, cannot predict whether an opt-out or withdrawal will be honoured.", "recommendation": "Publish a federal or inter-emirate rule on whether and how an opt-out registered in one emirate binds exchanges in another.", "origin": "Hypothesis written before the run. In the final recorded run the agent independently reported, at event 4, that it found no opt-out provision for Abu Dhabi's exchange equivalent to Dubai's, which matches the team's full-text scan. Verified by the team in the source text.", "caveats": "The Abu Dhabi policy is from April 2020 and may have been superseded. English text only.", "evidence": [{"label": "DHA Consent Standard 9.3", "chunk_id": "dha-consent-access-standard-2025#0018"}, {"label": "DoH HIE Policy 4.2 (mandatory participation)", "chunk_id": "doh-hie-policy-2020#0021"}, {"label": "DoH HIE Policy 4.2.1.2 (sharing without consent)", "chunk_id": "doh-hie-policy-2020#0021"}, {"label": "PDPL Art. 6(2) (general withdrawal right)", "chunk_id": "uae-pdpl-2021#0010"}, {"label": "PDPL Art. 2(2)(e) (health data exclusion)", "chunk_id": "uae-pdpl-2021#0005"}], "comparison": [{"label": "EHDS Art. 10(1)", "chunk_id": "eu-ehds-2025-327#0094"}]}, {"id": "G2", "title": "Emergency access to an opted-out patient's records across emirates is unresolved", "statement": "The Dubai standard says an opted-out patient's data should not be retrieved by break-the-glass. The federal Executive Regulation and the ICT Health Law allow access in an emergency or to protect the patient's health and safety, and Abu Dhabi has its own 'break the seal' rule. The Dubai standard's scope is PHI within Dubai. No ingested provision says which rule governs a clinician in one emirate requesting an opted-out patient's data held in another.", "relevance": "Our scenario's event 5: an unconscious, bleeding patient whose opt-out blocks the clinician who needs her full medication list. The system blocked and escalated to a human.", "recommendation": "State, in federal guidance, whether an opt-out can be overridden for vital interests and which emirate's emergency rule applies to cross-emirate requests. The EU resolves the same question explicitly in EHDS Art. 10.", "origin": "Hypothesis written before the run. The agent independently found the conflict and the scope question at event 5 and cited Executive Regulation Art. 6(3) and the Abu Dhabi provision, which we had not scripted. Verified by the team.", "caveats": "Whether the emergency block is the right behavior is a legal question; the consent module's setting is a configuration choice, not a conclusion.", "evidence": [{"label": "DHA Consent Standard 9.7", "chunk_id": "dha-consent-access-standard-2025#0018"}, {"label": "DHA Consent Standard 2.1 (scope)", "chunk_id": "dha-consent-access-standard-2025#0011"}, {"label": "Executive Regulation Art. 6(3)", "chunk_id": "uae-health-ict-exec-reg-2020#0007"}, {"label": "Federal ICT Health Law Art. 16(3)", "chunk_id": "uae-health-ict-law-2019#0019"}, {"label": "DoH HIE Policy 6.1.4", "chunk_id": "doh-hie-policy-2020#0054"}], "comparison": [{"label": "EHDS Art. 10(2)", "chunk_id": "eu-ehds-2025-327#0094"}]}, {"id": "G3", "title": "No ingested provision assigns responsibility for cross-institution follow-up", "statement": "No ingested UAE text assigns responsibility for coordinating follow-up on high-severity medication findings that span prescribers in different emirates. Full-text scans find no 'medication reconciliation' or 'responsible for coordinating' anywhere. The nearest provisions concern exchange interoperability and referral data, not who acts on a finding.", "relevance": "Our scenario's event 6: three prescribers in two emirates, two high-severity findings, and no stated owner.", "recommendation": "Define which institution (for example the most recent prescriber or the patient's primary care provider) owns the response to a cross-institution medication-safety finding.", "origin": "Hypothesis written before the run; reported by the agent after a multi-query search (the search log is in the run record), with the team's full-text scans as an independent check.", "caveats": "Absence in the ingested documents is not proof that no rule exists elsewhere. The EU comparator concerns reporting by digital health authorities, not clinical responsibility.", "evidence": [{"label": "DoH HIE Policy (objective: interoperability for coordination of care)", "chunk_id": "doh-hie-policy-2020#0037"}, {"label": "DoH Circular 2026/144 (referral data)", "chunk_id": "doh-circular-2026-144-malaffi-referrals#0001"}], "comparison": [{"label": "EHDS Art. 20 (authority-level coordination only)", "chunk_id": "eu-ehds-2025-327#0107"}]}, {"id": "G4", "title": "No ingested provision addresses externally hosted AI processing of health data", "statement": "The ICT Health Law restricts storing or processing health data outside the State unless a Health Authority resolution allows it. The Dubai AI policy requires AI solutions to comply with that law but never mentions cloud, location or localization (full-text scan: zero hits), and the instrument that lists exceptions (Ministerial Decision 51 of 2021) is not in our KB. Whether an externally hosted LLM can lawfully process real patient data is therefore not answered by the ingested texts.", "relevance": "This prototype uses a cloud LLM on synthetic data only. A real deployment would need an in-country model or a lawful exception.", "recommendation": "Clarify how Art. 13 applies to AI services hosted abroad, and publish the exceptions in one place alongside the AI policies.", "origin": "Identified in the team's own review, not raised by the agent.", "caveats": "Ministerial Decision 51 of 2021 and the Abu Dhabi AI policy and Responsible AI Standard are not ingested (the Abu Dhabi files could not be downloaded). This gap is limited to the texts we hold.", "evidence": [{"label": "Federal ICT Health Law Art. 13", "chunk_id": "uae-health-ict-law-2019#0016"}, {"label": "DHA AI Policy 4.6.2", "chunk_id": "dha-ai-policy-2021#0009"}], "comparison": []}], "events_meta": [{"seq": 1, "title": "Baseline records arrive from Hospitals A and C", "at": "2026-11-02T09:00", "narrative": "Fatima (72) has kidney disease, type 2 diabetes, hypertension and atrial fibrillation, and a recorded penicillin allergy. Cardiology (A) uploads warfarin and ramipril; endocrinology (C) uploads metformin. No lab results are on file yet.", "actor": "Hospital A, Hospital C", "access": {"C_reads_A_meds": "Hospital C clinician asks for Hospital A medications"}}, {"seq": 2, "title": "Hospital B (Dubai) prescribes spironolactone", "at": "2026-11-03T10:00", "narrative": "Nephrology at Hospital B, in a different emirate, adds spironolactone. The patient already takes ramipril and has kidney disease. Neither hospital knows about the other's prescription unless data is shared.", "actor": "Hospital B", "access": {"A_reads_B_meds": "Hospital A clinician asks for Hospital B medications via NABIDH", "B_reads_A_meds": "Hospital B clinician asks for Hospital A medications via Malaffi"}}, {"seq": 3, "title": "Overdue lab results arrive three days late", "at": "2026-11-06T16:00", "narrative": "eGFR and potassium were taken on 3 Nov but only reach the system on 6 Nov. Until now the system had to treat both as unknown.", "actor": "Hospital C lab", "access": {}}, {"seq": 4, "title": "Patient withdraws consent for Hospital B's data and opts out of NABIDH", "at": "2026-11-07T11:00", "nar
